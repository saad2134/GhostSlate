name: Keep Render Warm

on:
  schedule:
    # Run every 10 minutes
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping GhostSlate Service
        run: |
          URL="https://ghostslate.onrender.com/api/scenarios"

          echo "Pinging $URL..."

          STATUS=$(curl -sS -o /dev/null \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 60 \
            "$URL") || {
              echo "ERROR: Request failed or timed out."
              exit 1
            }

          echo "HTTP Status Code: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Ping successful."
          else
            echo "ERROR: Unexpected HTTP status $STATUS"
            exit 1
          fi
