name: Keep Render Warm

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from hibernating (15 min inactivity limit)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual run from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GhostSlate Service
        run: |
          echo "Sending keep-alive ping to https://ghostslate.onrender.com/api/scenarios..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://ghostslate.onrender.com/api/scenarios")
          echo "HTTP Status Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Instance is active and warm!"
          else
            echo "Warning: Service responded with code $STATUS"
          fi
